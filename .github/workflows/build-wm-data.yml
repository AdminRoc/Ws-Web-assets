name: 构建物品检索数据(物品库+掉落反查)

# Compatibility entry point only. Source production now belongs to Ws-Web.
# This workflow never checks out or writes Ws-Web artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Ws-Web-owned item producer
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: gh workflow run .github/workflows/build-item-data.yml --repo AdminRoc/Ws-Web --ref main
