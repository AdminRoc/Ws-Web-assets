name: 手动生成物品中文名补充字典

# 生成 data/item/item-names-zh.json（掉落奖励/特殊名词的 en->zh 补充字典），
# 由私库的 lookup_names.py 生成：
#   优先级：MANUAL 手动词条 -> 公开双语 dict -> 兜底
# 作用：item/world 独立站经 CDN 引用，作为掉落奖励中文名的"只填空"兜底
#      （不覆盖 wm-items.json 的可交易物品 zh，也不覆盖 item-i18n-harvest.json）
# 触发：手动 Run workflow（更新频率低，无需定时）
on:
  workflow_dispatch:

concurrency:
  group: gen-item-names-zh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Ws-Web 公库
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: 拉取私库（生成脚本）
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖脚本进工作树（不提交回公库）
        run: |
          mkdir -p .github/scripts
          cp -a _private/.github/scripts/lookup_names.py .github/scripts/
          rm -rf _private

      - name: 生成 data/item/item-names-zh.json
        run: python3 .github/scripts/lookup_names.py

      - name: 提交并推送（只提交产物，无变化时跳过）
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/item-names-zh.json
          git diff --staged --quiet && { echo "无实质变动,跳过提交"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "$(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "推送成功(第 $i 次)"; echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "推送被拒(第 $i 次),拉取远端后 rebase 重试..."
            git pull --rebase --autostash origin main || true
          done
          echo "重试多次仍推送失败" >&2; exit 1

      - name: 同步产物到 assets 镜像(world 等外部站点经 jsDelivr 引用)
        if: steps.commit.outputs.pushed == 'true'
        run: |
          rm -rf /tmp/assets-mirror
          git clone --depth 1 "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/AdminRoc/Ws-Web-assets.git" /tmp/assets-mirror
          mkdir -p /tmp/assets-mirror/data/item
          cp data/item/item-names-zh.json /tmp/assets-mirror/data/item/
          cd /tmp/assets-mirror
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/item-names-zh.json
          git diff --staged --quiet && { echo "assets 镜像无变化"; exit 0; }
          git commit -m "sync item-names-zh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "assets 镜像同步成功"; exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          echo "assets 镜像同步失败" >&2; exit 1
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
