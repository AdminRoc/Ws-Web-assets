name: 手动生成物品中文名补充字典

# 生成 data/item/item-names-zh.json（掉落奖励/特殊名词的 en->zh 补充字典），
# 由私库的 lookup_names.py 生成：
#   优先级：MANUAL 手动词条 -> 公开双语 dict -> 兜底
# 作用：item/world 独立站经 CDN 引用，作为掉落奖励中文名的"只填空"兜底
#      （不覆盖 wm-items.json 的可交易物品 zh，也不覆盖 item-i18n-harvest.json）
# 触发：手动 Run workflow（更新频率低，无需定时）
on:
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: Internal stale-producer retry marker
        required: false
        default: '0'
        type: string

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false
  queue: max

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Ws-Web 公库
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: 拉取私库（生成脚本）
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          ref: 3606522cea52b15ee028bfb35de0d98e4892c054
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖脚本进工作树（不提交回公库）
        run: |
          mkdir -p .github/scripts
          cp -a _private/.github/scripts/lookup_names.py _private/.github/scripts/verify_ws_web_target_revision.py .github/scripts/
          rm -rf _private

      - name: 生成 data/item/item-names-zh.json
        run: python3 .github/scripts/lookup_names.py

      - name: 验证 Ws-Web target revision 未推进
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_ws_web_target_revision.py "$(git rev-parse HEAD)"

      - name: 提交并推送（只提交产物，无变化时跳过）
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/item-names-zh.json
          git diff --staged --quiet && { echo "无实质变动,跳过提交"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "$(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the contract item release publisher
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/sync-item-kv.yml --repo AdminRoc/Ws-Web-assets --ref main
