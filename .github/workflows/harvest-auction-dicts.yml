name: Harvest Auction Dicts

# 收割拍卖字典数据（武器/词条列表）到 data/item/auction-dicts/，
# 使 item.html 拍卖搜索的自动补全不需要实时 API。一周两次，保持数据新鲜。
#
# 收割脚本在私库(.github/scripts 整体 gitignore，与
# cache-item-icons.yml / harvest-pinyin.yml 同一约定)；运行前 checkout 私库
# 覆盖进工作树，只把收割出的数据文件提交回公库，私库脚本绝不提交回公库。

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC（拍卖字典月度级变化；2026-08-07 从每日 2 次降为每周，省构建配额）
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: Internal stale-producer retry marker
        required: false
        default: '0'
        type: string

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web 公库
        uses: actions/checkout@v4
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: 拉取私库(收割脚本)
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          ref: 17f4edb881ae478d93bf978824a1c0608bf8ba1b
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖私库脚本进工作树(不会被提交回公库)
        run: |
          mkdir -p .github/scripts
          cp -a _private/.github/scripts/harvest_auction_dicts.py _private/.github/scripts/verify_ws_web_target_revision.py .github/scripts/
          rm -rf _private

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run harvest script
        run: python .github/scripts/harvest_auction_dicts.py

      - name: 验证 Ws-Web target revision 未推进
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_ws_web_target_revision.py "$(git rev-parse HEAD)"

      - name: Commit & push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/auction-dicts/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh auction dictionaries"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the contract item release publisher
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/sync-item-kv.yml --repo AdminRoc/Ws-Web-assets --ref main
