name: 挖掘官方本地化汉化候选词(人工review用,非自动生效)

# Review-only output belongs to Ws-Web-assets. The pinned Core translation source
# is copied to a temporary runner directory; neither Core nor Ws-Web is modified.
on:
  workflow_dispatch:

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web-assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout the pinned Core review producer and translation source
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          ref: 17f4edb881ae478d93bf978824a1c0608bf8ba1b
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: Generate candidate output outside both source repositories
        run: |
          set -euo pipefail
          candidate_root="$(mktemp -d "$RUNNER_TEMP/calamity-candidate.XXXXXX")"
          mkdir -p "$candidate_root/.github/scripts" "$candidate_root/data" data/review-candidates
          cp _private/.github/scripts/harvest_calamity_i18n.py "$candidate_root/.github/scripts/"
          cp _private/data/wf-translations.json "$candidate_root/data/"
          python3 "$candidate_root/.github/scripts/harvest_calamity_i18n.py"
          test -s "$candidate_root/data/calamity-i18n-harvest.json"
          cp "$candidate_root/data/calamity-i18n-harvest.json" \
            data/review-candidates/calamity-i18n-harvest.json

      - name: Commit only the review candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/review-candidates/calamity-i18n-harvest.json
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          test "$staged" = "data/review-candidates/calamity-i18n-harvest.json" || {
            echo "Unexpected staged path; refusing to publish" >&2
            exit 1
          }
          if git diff --cached --quiet; then
            echo "No candidate changes; keeping the published review artifact."
            exit 0
          fi
          git commit -m "data: refresh official localization review candidates"
          git push origin HEAD:main
