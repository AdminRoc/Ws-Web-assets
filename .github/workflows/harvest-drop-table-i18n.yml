name: 挖掘掉落来源汉化候选词(人工review用,非自动生效)

# Review-only output belongs to Ws-Web-assets. The only Ws-Web input is the
# contract-declared data/item/drops-index.json; this workflow never writes Ws-Web.
on:
  workflow_dispatch:

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web-assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout only the declared drop-index input
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _item-source
          sparse-checkout: data/item/drops-index.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout the pinned review producer
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          ref: 17f4edb881ae478d93bf978824a1c0608bf8ba1b
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: Generate candidate output in the Assets repository only
        env:
          DROPS_INDEX: ${{ github.workspace }}/_item-source/data/item/drops-index.json
          HARVEST_OUT: ${{ github.workspace }}/data/review-candidates/drop-table-i18n-harvest.json
        run: |
          set -euo pipefail
          mkdir -p data/review-candidates
          python3 _private/.github/scripts/harvest_drop_table_i18n.py
          test -s "$HARVEST_OUT"

      - name: Commit only the review candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/review-candidates/drop-table-i18n-harvest.json
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          test "$staged" = "data/review-candidates/drop-table-i18n-harvest.json" || {
            echo "Unexpected staged path; refusing to publish" >&2
            exit 1
          }
          if git diff --cached --quiet; then
            echo "No candidate changes; keeping the published review artifact."
            exit 0
          fi
          git commit -m "data: refresh drop-table translation review candidates"
          git push origin HEAD:main
