name: 收割掉落表物品中文译名

# Compatibility entry point only. The append-only producer is owned by Ws-Web.
# This workflow has no schedule and never checks out or writes Ws-Web artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Ws-Web-owned translation producer
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: gh workflow run .github/workflows/harvest-item-translations.yml --repo AdminRoc/Ws-Web --ref main
