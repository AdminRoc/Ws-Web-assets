name: 收割掉落表物品中文译名

# Manual compatibility alias. The unified public translation producer owns the schedule.
# This entry point does not check out or write Ws-Web artifacts itself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Ws-Web-owned translation producer
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: gh workflow run .github/workflows/harvest-wm-items-i18n.yml --repo AdminRoc/Ws-Web-assets --ref main
