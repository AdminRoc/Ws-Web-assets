name: 定时任务失败通知

# 生产数据、发布和关键只读校验工作流若失败，过去可能只能手动翻 Actions 页面发现。
# 本工作流监听当前有效的相关工作流，一旦 conclusion=failure，就开/更一个带
# ci-failure 标签的 Issue（GitHub 通知取决于仓库通知设置）——不新增外部依赖或密钥。
#
# 手动 review 候选工作流不纳入；高频心跳流也不纳入，避免无意义告警。
on:
  workflow_run:
    workflows:
      - 每日抓取物品图标
      - 构建物品检索数据(物品库+掉落反查)
      - Harvest Auction Dicts
      - 收割掉落表物品中文译名
      - 收割 WM 可交易物品中文译名
      - 生成拼音检索表
      - 手动生成物品中文名补充字典
      - 补齐物品检索缺失缩略图
      - 同步完整物品发布到 EdgeOne KV
      - Publish non-item runtime data
      - Verify main-site item artifact release
    types: [completed]

permissions:
  issues: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 开/更失败 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `⚠️ 定时任务失败：${run.name}`;
            const body =
              `工作流 **${run.name}** 的一次定时运行失败了。\n\n` +
              `- 运行链接：${run.html_url}\n` +
              `- 触发方式：${run.event}\n` +
              `- 分支：${run.head_branch}\n` +
              `- 提交：${run.head_sha}\n` +
              `- 时间：${run.updated_at}\n\n` +
              `请查看运行日志定位原因；修复后可在 Actions 页面手动 Re-run，确认通过后关闭本 Issue。`;
            // 同名 open issue 已存在则追加评论，否则新建——避免每次失败都堆一个新 Issue。
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure'],
              });
            }
