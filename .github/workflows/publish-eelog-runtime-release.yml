name: 发布 EELog 运行时 release 描述

# This workflow does not generate or modify private Ws-Web outputs. It creates
# a small public descriptor that pins the already mirrored EELog runtime family
# to one immutable Ws-Web-assets commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Build deterministic runtime descriptor
        run: |
          set -euo pipefail
          artifacts=(
            js/wf-translations.js
            data/i18n/wf-i18n.json
            data/arbitration-metrics/arb-node-baseline.js
            data/arbitration-metrics/arb-node-baseline.json
          )
          revision=$(git log -1 --format=%H -- "${artifacts[@]}")
          test -n "$revision" || { echo "Missing runtime artifact revision"; exit 1; }
          python3 tools/build_eelog_runtime_release.py --assets-revision "$revision"

      - name: Commit descriptor when the runtime family changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eelog-runtime-release.json
          git diff --staged --quiet && exit 0
          git commit -m "data: publish eelog runtime release [skip ci]"
          git push origin main
