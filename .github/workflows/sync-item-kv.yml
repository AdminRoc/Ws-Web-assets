name: 同步物品数据到 EdgeOne KV (直写 KV，不经自定义域)

# 把 item 模块需要的数据文件（公库 data/ 下的最新产物）直写 Makers KV，
# item 页面通过 item.wfspeed.run/api/kv?key=... 同源读取时边缘函数 HKDF 解密。
# 仅公库暴露内容反爬，私库不落密文。大文件 drops-index 4.3MB 超限仅 cdn，不进 KV。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web 公库
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: 拉取 Ws-Web-assets 的 manifest.json
        run: |
          curl -sL --max-time 60 -o /tmp/manifest.json \
            "https://raw.githubusercontent.com/AdminRoc/Ws-Web-assets/main/manifest.json" || true
          if [ ! -s /tmp/manifest.json ]; then
            echo "manifest 拉取失败，跳过（页面有 data.wfspeed.run 兜底）"
          fi

      - name: 拉取私库 kv_put 真源
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖 kv_put 到工作树
        run: cp _private/.github/scripts/kv_put.py /tmp/kv_put.py

      - name: 写入 EdgeOne KV (直写，不经 /api/update-kv)
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
          KV_NAMESPACE: ${{ secrets.KV_NAMESPACE_ASSETS }}
        run: |
          set -euo pipefail
          test -n "${TENCENTCLOUD_SECRET_ID}" || { echo 'Missing TENCENTCLOUD_SECRET_ID'; exit 1; }
          pip install -q tencentcloud-sdk-python cryptography
          for spec in wm_items_json=data/item/wm-items.json icon_index_json=data/item/icon-index.json item_names_zh_json=data/item/item-names-zh.json pinyin_map_json=data/item/pinyin-map.json wiki_icon_harvest_json=data/item/wiki-icon-harvest.json item_i18n_harvest_json=data/item/item-i18n-harvest.json; do
            key="${spec%%=*}"; file="${spec#*=}";
            test -f "${file}" || { echo "skip $key ($file 不存在)"; continue; }
            # 大文件 drops-index 4.3MB 超限仅 cdn，已在产线控制，此处跳过
            if [ "${key}" = "drops_index_json" ]; then echo "skip $key (超限仅 cdn)"; continue; fi
            echo "KV put $key <- $file"
            python3 /tmp/kv_put.py --zone "${ZONE_ID}" --ns "${KV_NAMESPACE}" --key "${key}" --file "${file}"
          done
          if [ -s /tmp/manifest.json ]; then
            echo "KV put manifest_json <- /tmp/manifest.json"
            python3 /tmp/kv_put.py --zone "${ZONE_ID}" --ns "${KV_NAMESPACE}" --key "manifest_json" --file "/tmp/manifest.json"
          fi
