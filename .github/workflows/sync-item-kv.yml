name: 同步完整物品发布到 EdgeOne KV

# Reads only Ws-Web/data/item/**. It never modifies Ws-Web, leaderboard data,
# or manually maintained records. drops-index.json is assets-only because the
# documented EdgeOne KV value limit is 1 MB.
on:
  workflow_dispatch:
    inputs:
      cf_schedule_fallback:
        description: Mark as the hourly Cloudflare schedule fallback
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_capture: ${{ steps.guard.outputs.run_capture }}
    steps:
      - name: Checkout freshness guard
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: .github/scripts
      - name: Gate periodic item-KV syncs on the last complete publication
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          CF_SCHEDULE_FALLBACK: ${{ github.event.inputs.cf_schedule_fallback }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          WORKFLOW_FILE: sync-item-kv.yml
          PRODUCER_JOB: publish
          MIN_AGE_MINUTES: "50"
        run: python3 .github/scripts/workflow_freshness_guard.py

  publish:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_capture == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web-assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout item artifact source
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _source
          fetch-depth: 1

      - name: Mirror and validate declared plaintext artifacts
        run: |
          python3 tools/sync_item_artifacts.py --source-root _source
          python3 tools/validate_item_artifacts.py --source-root _source --report /tmp/item-artifact-report.json

      - name: Verify deployed hash-aware item consumers before publication
        env:
          ITEM_SITE_ROOT: https://item.wfspeed.run
        run: |
          python3 - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen
          import os

          root = os.environ['ITEM_SITE_ROOT'].rstrip('/') + '/'
          pattern = re.compile(
              r'<script\b[^>]*\bsrc=["\']([^"\']*js/item-release-loader\.js[^"\']*)["\']',
              re.IGNORECASE,
          )
          script_urls = []
          for page in ('index.html', 'item.html'):
              with urlopen(urljoin(root, page), timeout=45) as response:
                  body = response.read().decode('utf-8', errors='replace')
              matches = pattern.findall(body)
              if len(matches) != 1:
                  raise SystemExit(f'{page} must load exactly one item release loader; refusing publication')
              script_urls.append(urljoin(root, matches[0]))

          if script_urls[0] != script_urls[1]:
              raise SystemExit('Item pages reference different loader revisions; refusing publication')
          parsed = urlparse(script_urls[0])
          if parsed.scheme != 'https' or parsed.netloc != urlparse(root).netloc:
              raise SystemExit('Item release loader must be served by the item site; refusing publication')
          with urlopen(script_urls[0], timeout=45) as response:
              loader = response.read().decode('utf-8', errors='replace')
          for guard in ('release artifact hash mismatch', 'verified release hash unavailable'):
              if guard not in loader:
                  raise SystemExit(f'Production loader lacks required guard {guard!r}; refusing publication')
          print('Both deployed item pages use the same hash- and release-guarded loader.')
          PY

      - name: Commit complete public fallback mirror
        id: mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/ item-artifact-contract.json tools/sync_item_artifacts.py tools/validate_item_artifacts.py docs/item-data-release.md edgeone.json .gitignore
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: sync complete item artifact release [skip ci]"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish verified plaintext KV artifacts to wfspeed-item
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KV_WRITE_TOKEN}" || { echo "Missing KV_WRITE_TOKEN"; exit 1; }
          release="data/item/item-release.json"
          marker="/tmp/item-release-meta.json"
          test -f "$release" || { echo "Missing item release metadata"; exit 1; }
          python3 - "$release" "$marker" "$(git rev-parse HEAD)" <<'PY'
          import json, pathlib, sys
          source, target, assets_revision = sys.argv[1:]
          release = json.loads(pathlib.Path(source).read_text(encoding='utf-8'))
          release['assets_revision'] = assets_revision
          pathlib.Path(target).write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          publish() {
            local key="$1"
            local file="$2"
            local payload="/tmp/${key}.json"
            local current status decision
            current="$(mktemp)"
            status="$(curl --silent --show-error --fail-with-body --retry 3 --max-time 60 \
              --output "$current" --write-out '%{http_code}' \
              "https://item.wfspeed.run/api/kv?key=${key}&v=preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)"
            if ! decision="$(python3 tools/item_kv_preflight.py "$status" "$current" "$file")"; then
              rm -f "$current"
              return 1
            fi
            rm -f "$current"
            if [ "$decision" = "skip" ]; then
              echo "KV value already matches source; skipped PUT: $key"
              return 0
            fi
            if [ "$decision" != "publish" ]; then
              echo "Unexpected KV preflight decision for $key" >&2
              return 1
            fi
            python3 - "$key" "$file" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          data = json.loads(value)
          if isinstance(data, dict) and data.get('ct'):
              raise SystemExit(source + ' must be plaintext JSON')
          if len(value.encode('utf-8')) > 1048576:
              raise SystemExit(source + ' exceeds the documented 1 MB KV limit')
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 180 \
              -X POST "https://item.wfspeed.run/api/update-kv" \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H "Content-Type: application/json" --data-binary "@$payload"
            python3 - "$key" "$file" <<'PY'
          import hashlib, json, sys, time, urllib.request
          key, source = sys.argv[1:]
          expected = open(source, 'rb').read()
          url = 'https://item.wfspeed.run/api/kv?key=' + key + '&v=' + str(time.time_ns())
          with urllib.request.urlopen(url, timeout=60) as response:
              actual = response.read()
          json.loads(actual.decode('utf-8'))
          if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
              raise SystemExit('readback hash mismatch for ' + key)
          PY
            rm -f "$payload"
          }
          python3 - "$release" <<'PY' > /tmp/item-kv-list.tsv
          import json, sys
          release = json.load(open(sys.argv[1], encoding='utf-8'))
          for artifact in release['artifacts'].values():
              if artifact.get('delivery') == 'kv-and-assets':
                  print(artifact['kv_key'] + '\t' + artifact['path'])
          PY
          while IFS=$'\t' read -r key file; do
            publish "$key" "$file"
          done < /tmp/item-kv-list.tsv
          # Publish only after every required small artifact has been verified.
          publish item_release_meta "$marker"
