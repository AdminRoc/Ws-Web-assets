name: 发布物品数据指针

# Reads only Ws-Web/data/item/**. It never modifies Ws-Web, leaderboard data,
# or manually maintained records. Action artifacts are served from the public
# SHA-pinned raw release; EdgeOne KV stores only the small current-release pointer.
on:
  workflow_dispatch:
    inputs:
      cf_schedule_fallback:
        description: Mark as the hourly Cloudflare schedule fallback
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_capture: ${{ steps.guard.outputs.run_capture }}
    steps:
      - name: Checkout freshness guard
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: .github/scripts
      - name: Gate periodic item-KV syncs on the last complete publication
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          CF_SCHEDULE_FALLBACK: ${{ github.event.inputs.cf_schedule_fallback }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          WORKFLOW_FILE: sync-item-kv.yml
          PRODUCER_JOB: publish
          MIN_AGE_MINUTES: "50"
        run: python3 .github/scripts/workflow_freshness_guard.py

  publish:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_capture == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web-assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout item artifact source
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _source
          fetch-depth: 1

      - name: Mirror and validate declared plaintext artifacts
        run: |
          python3 tools/sync_item_artifacts.py --source-root _source
          python3 tools/validate_item_artifacts.py --source-root _source --report /tmp/item-artifact-report.json

      - name: Verify deployed hash-aware item consumers before publication
        env:
          ITEM_SITE_ROOT: https://item.wfspeed.run
        run: |
          python3 - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen
          import os

          root = os.environ['ITEM_SITE_ROOT'].rstrip('/') + '/'
          pattern = re.compile(
              r'<script\b[^>]*\bsrc=["\']([^"\']*js/item-release-loader\.js[^"\']*)["\']',
              re.IGNORECASE,
          )
          script_urls = []
          for page in ('index.html', 'item.html'):
              with urlopen(urljoin(root, page), timeout=45) as response:
                  body = response.read().decode('utf-8', errors='replace')
              matches = pattern.findall(body)
              if len(matches) != 1:
                  raise SystemExit(f'{page} must load exactly one item release loader; refusing publication')
              script_urls.append(urljoin(root, matches[0]))

          if script_urls[0] != script_urls[1]:
              raise SystemExit('Item pages reference different loader revisions; refusing publication')
          parsed = urlparse(script_urls[0])
          if parsed.scheme != 'https' or parsed.netloc != urlparse(root).netloc:
              raise SystemExit('Item release loader must be served by the item site; refusing publication')
          with urlopen(script_urls[0], timeout=45) as response:
              loader = response.read().decode('utf-8', errors='replace')
          for guard in ('release artifact hash mismatch', 'verified release hash unavailable', 'item_release_meta'):
              if guard not in loader:
                  raise SystemExit(f'Production loader lacks required guard {guard!r}; refusing publication')
          if re.search(r'IT_CDN\s*\+\s*encodeURIComponent\(\s*artifact\.(?:key|kv_key)', loader):
              raise SystemExit('Production item loader still reads per-artifact KV values; refusing raw-only publication')
          print('Both deployed item pages use the same hash- and release-guarded loader.')
          PY

      - name: Commit complete public fallback mirror
        id: mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/ item-artifact-contract.json tools/sync_item_artifacts.py tools/validate_item_artifacts.py docs/item-data-release.md edgeone.json .gitignore
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: sync complete item artifact release [skip ci]"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish pointer to verified raw artifact release
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_item_release_pointer.py
