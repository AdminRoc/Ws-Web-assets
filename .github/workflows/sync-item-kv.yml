name: 同步完整物品发布到 EdgeOne KV

# Reads only Ws-Web/data/item/**. It never modifies Ws-Web, leaderboard data,
# or manually maintained records. drops-index.json is assets-only because the
# documented EdgeOne KV value limit is 1 MB.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: ws-web-batch-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ws-Web-assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout item artifact source
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _source
          fetch-depth: 1

      - name: Mirror and validate declared plaintext artifacts
        run: |
          python3 tools/sync_item_artifacts.py --source-root _source
          python3 tools/validate_item_artifacts.py --source-root _source --report /tmp/item-artifact-report.json

      - name: Commit complete public fallback mirror
        id: mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/item/ item-artifact-contract.json tools/ docs/ edgeone.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: sync complete item artifact release [skip ci]"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish verified plaintext KV artifacts to wfspeed-item
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KV_WRITE_TOKEN}" || { echo "Missing KV_WRITE_TOKEN"; exit 1; }
          release="data/item/item-release.json"
          marker="/tmp/item-release-meta.json"
          test -f "$release" || { echo "Missing item release metadata"; exit 1; }
          python3 - "$release" "$marker" "$(git rev-parse HEAD)" <<'PY'
          import json, pathlib, sys
          source, target, assets_revision = sys.argv[1:]
          release = json.loads(pathlib.Path(source).read_text(encoding='utf-8'))
          release['assets_revision'] = assets_revision
          pathlib.Path(target).write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          publish() {
            local key="$1"
            local file="$2"
            local payload="/tmp/${key}.json"
            python3 - "$key" "$file" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          data = json.loads(value)
          if isinstance(data, dict) and data.get('ct'):
              raise SystemExit(source + ' must be plaintext JSON')
          if len(value.encode('utf-8')) > 1048576:
              raise SystemExit(source + ' exceeds the documented 1 MB KV limit')
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 180 \
              -X POST "https://item.wfspeed.run/api/update-kv" \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H "Content-Type: application/json" --data-binary "@$payload"
            python3 - "$key" "$file" <<'PY'
          import hashlib, json, sys, urllib.request
          key, source = sys.argv[1:]
          expected = open(source, 'rb').read()
          with urllib.request.urlopen('https://item.wfspeed.run/api/kv?key=' + key, timeout=60) as response:
              actual = response.read()
          json.loads(actual.decode('utf-8'))
          if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
              raise SystemExit('readback hash mismatch for ' + key)
          PY
            rm -f "$payload"
          }
          python3 - "$release" <<'PY' > /tmp/item-kv-list.tsv
          import json, sys
          release = json.load(open(sys.argv[1], encoding='utf-8'))
          for artifact in release['artifacts'].values():
              if artifact.get('delivery') == 'kv-and-assets':
                  print(artifact['kv_key'] + '\t' + artifact['path'])
          PY
          while IFS=$'\t' read -r key file; do
            publish "$key" "$file"
          done < /tmp/item-kv-list.tsv
          # Publish only after every required small artifact has been verified.
          publish item_release_meta "$marker"
